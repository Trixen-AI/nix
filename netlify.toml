# Netlify deploy settings for ZKSona (https://zksona.org)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SITE_URL = "https://zksona.org"
  # Set VITE_REOWN_PROJECT_ID (and optionally VITE_SOLANA_RPC_URL)
  # in Netlify: Site configuration > Environment variables. They are not stored in this repo.

# www -> apex
[[redirects]]
  from = "https://www.zksona.org/*"
  to = "https://zksona.org/:splat"
  status = 301
  force = true

# Single-page app: /app/* and unknown paths serve the app (React Router handles them)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Hashed build assets never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dashboard pages stay out of search results
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
